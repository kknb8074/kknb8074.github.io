<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070A">
<title>页面走丢了 · 小正不是神</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#07070A;
    color:#F8E3AE;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center}
  .code{font-size:74px;font-weight:800;letter-spacing:.06em;color:#E8C46A;
    text-shadow:0 0 34px rgba(232,196,106,.45),0 0 80px rgba(232,196,106,.18)}
  p{margin:16px 0 30px;font-size:15px;line-height:1.8;color:#8A8792;letter-spacing:.04em}
  a{display:inline-block;padding:13px 36px;border-radius:14px;text-decoration:none;
    font-weight:700;font-size:15px;color:#07070A;letter-spacing:.08em;
    background:linear-gradient(135deg,#F8E3AE,#E8C46A);box-shadow:0 10px 28px rgba(232,196,106,.26)}
  a:active{transform:scale(.97)}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <p>这个页面不存在，或者已经被移走了</p>
    <a href="/">回到首页</a>
  </div>
</body>
</html>
